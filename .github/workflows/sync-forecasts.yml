name: Sync Forecast CSVs

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'content/forecasts/**'
      - 'content/priogrid_cellshp/**'
      - 'package.json'
      - 'app/forecasts-grid/**'
      - 'components/PrioGridMap.tsx'
      - '.github/workflows/sync-forecasts.yml'
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-forecasts
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          # NumPy 2.x layout matches the pickles produced by the forecasting pipeline
          python -m pip install --upgrade pip
          pip install "numpy>=2.0.0" "pandas>=2.0.0"

      - name: Sync forecasts from GitHub CSVs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run csv:sync:github -- \
            --repo conflictlab/Pace-map-risk \
            --dir '' \
            --branch main \
            --latestOnly \
            --saveCsv \
            --token $GITHUB_TOKEN
      - name: Mirror latest forecasts and archive for downloads
        run: |
          node scripts/mirror-forecasts-with-dates.js
          node scripts/sync-historical-archive.js

      - name: Build dashboard snapshots from the archive (real fatalities, no capping)
        run: |
          node scripts/build-snapshots-from-archive.js
          cp public/data/forecasts/latest/Hist.csv public/data/hist.csv

      - name: Update scenarios, matches and confidence data for country pages
        run: |
          set -e
          SRC=https://raw.githubusercontent.com/conflictlab/Pace-map-risk/main
          curl -fsSL "$SRC/sce_dictionary.pkl" -o sce_dictionary.pkl
          npm run scenarios:convert -- --src sce_dictionary.pkl --out public/data/scenarios.json
          npm run data:update
          curl -fsSL "$SRC/saved_dictionary.pkl" -o matches.pkl
          npm run matches:convert -- --src matches.pkl --out public/data/matches.json
          curl -fsSL "$SRC/Conf.csv" -o public/data/conf.csv
          rm -f sce_dictionary.pkl matches.pkl

      - name: Build PRIO-GRID centroids from shapefile
        run: npm run grid:centroids
      - name: Build PRIO-GRID GeoJSON from live CSV
        run: npm run grid:build

      - name: Build monthly point JSONs
        run: node scripts/geojson-to-month-points.js

      - name: Build grid CSV for current period
        run: node scripts/grid-geojson-to-csv.js

      - name: Build per-month grid CSVs (m1..m6)
        run: node scripts/grid-month-points-to-csv.js

      - name: Commit changes (if any)
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add content/forecasts public/data/csv public/data/grid public/data/forecasts public/data/hist.csv public/data/scenarios.json public/data/scenarios.denorm.json public/data/minmax.json public/data/matches.json public/data/conf.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync forecasts + grid assets (centroids, geojson, monthly points)"
          fi
          # Rebase on latest main to avoid non-fast-forward push failures
          git fetch origin main
          if ! git pull --rebase origin main; then
            echo "Rebase failed; aborting rebase and skipping push to avoid conflicts." >&2
            git rebase --abort || true
            exit 1
          fi
          # Push rebased commit (or no-op if nothing changed)
          git push origin HEAD:main
